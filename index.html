<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bibliothèque de connaissances</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #20242a;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e1e5e9;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      color: #68717d;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .search-box {
      background: #ffffff;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #e1e5e9;
      margin-bottom: 25px;
    }

    .search-box input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccd2d8;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #6b7280;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: #68717d;
    }

    .message {
      background: #ffffff;
      border: 1px solid #e1e5e9;
      border-radius: 14px;
      padding: 25px;
      text-align: center;
      color: #68717d;
    }

    .articles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .article-card {
      display: block;
      background: #ffffff;
      border: 1px solid #e1e5e9;
      border-radius: 14px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .article-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.07);
    }

    .article-card h2 {
      margin: 0 0 10px;
      font-size: 21px;
    }

    .keywords {
      font-size: 14px;
      color: #68717d;
      line-height: 1.5;
    }

    .count {
      margin-bottom: 18px;
      font-size: 15px;
      color: #555e69;
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #7a838d;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      main {
        padding: 20px 15px;
      }

      .articles {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Bibliothèque de connaissances</h1>
  <p>Une bibliothèque publique de connaissances pour le synthétiseur</p>
</header>

<main>

  <section class="search-box">

    <input
      type="search"
      id="search"
      placeholder="Rechercher une connaissance..."
      autocomplete="off"
    >

    <div class="status" id="status">
      Détection des connaissances...
    </div>

  </section>

  <div class="count" id="count">
    Chargement...
  </div>

  <section id="articles" class="articles"></section>

  <div id="message" class="message hidden"></div>

</main>

<footer>
  Bibliothèque de connaissances — système statique GitHub Pages
</footer>


<script>

  /*
   * ============================================================
   * BIBLIOTHÈQUE AUTOMATIQUE
   * ============================================================
   *
   * Cette page détecte automatiquement les fichiers HTML
   * présents dans le dossier /articles/ du dépôt GitHub.
   *
   * Tu n'as donc plus besoin de modifier index.json.
   */


  const articlesContainer = document.getElementById("articles");
  const message = document.getElementById("message");
  const searchInput = document.getElementById("search");
  const countElement = document.getElementById("count");
  const statusElement = document.getElementById("status");


  let articles = [];


  /*
   * ------------------------------------------------------------
   * Trouver automatiquement le propriétaire et le dépôt
   * ------------------------------------------------------------
   *
   * Exemple :
   *
   * https://gondofo.github.io/ma-bibliotheque/
   *
   * devient :
   *
   * propriétaire = gondofo
   * dépôt = ma-bibliotheque
   */

  function getRepositoryInfo() {

    const hostname = window.location.hostname;
    const pathname = window.location.pathname;

    if (!hostname.endsWith(".github.io")) {
      throw new Error(
        "Cette bibliothèque doit être utilisée depuis GitHub Pages."
      );
    }

    const owner = hostname.split(".")[0];

    const parts = pathname
      .split("/")
      .filter(Boolean);

    if (parts.length === 0) {
      throw new Error(
        "Impossible de déterminer le nom du dépôt GitHub."
      );
    }

    const repository = parts[0];

    return {
      owner,
      repository
    };
  }


  /*
   * ------------------------------------------------------------
   * Nettoyage du texte
   * ------------------------------------------------------------
   */

  function normalize(text) {

    return String(text || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim();

  }


  /*
   * ------------------------------------------------------------
   * Transformer un nom de fichier en titre
   * ------------------------------------------------------------
   *
   * chaise.html → Chaise
   * grande-maison.html → Grande maison
   */

  function titleFromFilename(filename) {

    return filename
      .replace(/\.html$/i, "")
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, letter => letter.toUpperCase());

  }


  /*
   * ------------------------------------------------------------
   * Récupérer les fichiers du dossier articles/
   * ------------------------------------------------------------
   */

  async function detectArticles() {

    const {
      owner,
      repository
    } = getRepositoryInfo();


    const apiUrl =
      `https://api.github.com/repos/${owner}/${repository}/contents/articles/`;


    statusElement.textContent =
      "Recherche des articles dans la bibliothèque...";


    const response = await fetch(apiUrl, {
      headers: {
        "Accept": "application/vnd.github+json"
      },
      cache: "no-store"
    });


    if (!response.ok) {

      throw new Error(
        `GitHub n'a pas pu fournir la liste des articles.`
      );

    }


    const files = await response.json();


    /*
     * On garde uniquement les fichiers HTML.
     *
     * index.json est automatiquement ignoré.
     */

    const htmlFiles = files.filter(file => {

      return (
        file.type === "file" &&
        /\.html$/i.test(file.name)
      );

    });


    statusElement.textContent =
      `${htmlFiles.length} article(s) détecté(s).`;


    /*
     * Pour chaque article, on récupère son contenu afin
     * de lire :
     *
     * data-concept
     * data-keywords
     *
     */

    const results = await Promise.all(

      htmlFiles.map(async file => {

        const article = {

          filename: file.name,

          url: `./articles/${encodeURIComponent(file.name)}`,

          title: titleFromFilename(file.name),

          keywords: []

        };


        try {

          const articleResponse = await fetch(
            file.download_url,
            {
              cache: "no-store"
            }
          );


          if (articleResponse.ok) {

            const html =
              await articleResponse.text();


            const parser =
              new DOMParser();


            const documentArticle =
              parser.parseFromString(
                html,
                "text/html"
              );


            const element =
              documentArticle.querySelector(
                "[data-concept]"
              );


            if (element) {

              const concept =
                element.getAttribute(
                  "data-concept"
                );


              const keywords =
                element.getAttribute(
                  "data-keywords"
                );


              if (concept) {

                article.title = concept;

              }


              if (keywords) {

                article.keywords =
                  keywords
                    .split(",")
                    .map(word => word.trim())
                    .filter(Boolean);

              }

            }

          }

        } catch (error) {

          /*
           * Si un article ne peut pas être lu,
           * on garde quand même son fichier.
           */

          console.warn(
            "Impossible de lire les métadonnées :",
            file.name
          );

        }


        return article;

      })

    );


    return results;

  }


  /*
   * ------------------------------------------------------------
   * Afficher les articles
   * ------------------------------------------------------------
   */

  function renderArticles(list) {

    articlesContainer.innerHTML = "";


    if (list.length === 0) {

      message.textContent =
        "Aucune connaissance ne correspond à votre recherche.";

      message.classList.remove("hidden");

      countElement.textContent =
        "0 connaissance";

      return;

    }


    message.classList.add("hidden");


    countElement.textContent =
      `${list.length} connaissance${list.length > 1 ? "s" : ""}`;


    list.forEach(article => {

      const card =
        document.createElement("a");


      card.className =
        "article-card";


      card.href =
        article.url;


      const title =
        document.createElement("h2");


      title.textContent =
        article.title;


      card.appendChild(title);


      if (article.keywords.length > 0) {

        const keywords =
          document.createElement("div");


        keywords.className =
          "keywords";


        keywords.textContent =
          article.keywords.join(" • ");


        card.appendChild(keywords);

      }


      articlesContainer.appendChild(card);

    });

  }


  /*
   * ------------------------------------------------------------
   * Recherche
   * ------------------------------------------------------------
   */

  function searchArticles() {

    const query =
      normalize(searchInput.value);


    if (!query) {

      renderArticles(articles);

      return;

    }


    const results =
      articles.filter(article => {

        const title =
          normalize(article.title);


        const filename =
          normalize(article.filename);


        const keywords =
          article.keywords
            .map(normalize)
            .join(" ");


        return (
          title.includes(query) ||
          filename.includes(query) ||
          keywords.includes(query)
        );

      });


    renderArticles(results);

  }


  searchInput.addEventListener(
    "input",
    searchArticles
  );


  /*
   * ------------------------------------------------------------
   * Initialisation
   * ------------------------------------------------------------
   */

  async function startLibrary() {

    try {

      articles =
        await detectArticles();


      /*
       * Tri alphabétique
       */

      articles.sort((a, b) =>
        a.title.localeCompare(
          b.title,
          "fr"
        )
      );


      renderArticles(articles);


      statusElement.textContent =
        "Bibliothèque synchronisée avec les articles publics.";

    } catch (error) {

      console.error(error);


      statusElement.textContent =
        "Erreur lors de la détection.";


      countElement.textContent =
        "Impossible de charger les connaissances.";


      message.textContent =
        "La bibliothèque n'a pas réussi à récupérer les articles. Vérifie que le dépôt est public et que GitHub Pages fonctionne correctement.";


      message.classList.remove("hidden");

    }

  }


  startLibrary();

</script>

</body>
</html>
